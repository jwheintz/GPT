<!DOCTYPE html>
<html>
<head>
    <style>
        * { margin: 0; padding: 0; }
        body { 
            background: transparent; 
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        .reaction {
            position: absolute;
            font-size: 60px;
            animation: floatUp 3s ease-out forwards;
            opacity: 0;
        }
        @keyframes floatUp {
            0% { 
                opacity: 0; 
                transform: translateY(0) scale(0.5);
            }
            10% { 
                opacity: 1; 
                transform: translateY(-50px) scale(1);
            }
            90% {
                opacity: 1;
            }
            100% { 
                opacity: 0; 
                transform: translateY(-100vh) scale(0.8);
            }
        }
    </style>
</head>
<body>
    <script>
        // Get emoji from URL parameter: ?emoji=🔥&count=10
        const params = new URLSearchParams(window.location.search);
        const emoji = params.get('emoji') || '❤️';
        const count = parseInt(params.get('count') || '10');
        
        function createReaction() {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const reaction = document.createElement('div');
                    reaction.className = 'reaction';
                    reaction.textContent = emoji;
                    reaction.style.left = (Math.random() * 80 + 10) + 'vw';
                    reaction.style.bottom = '0';
                    reaction.style.animationDelay = (Math.random() * 0.5) + 's';
                    
                    document.body.appendChild(reaction);
                    
                    setTimeout(() => reaction.remove(), 4000);
                }, i * 100);
            }
        }
        
        createReaction();
    </script>
</body>
</html>
